[package]
name = "deepmem-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
accessibility-sys = "0.1"
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "libc", "NSApplication", "NSResponder", "NSEvent", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "objc2-core-foundation", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSGeometry", "NSObject", "NSRunLoop", "NSString", "NSURL", "NSURLRequest", "objc2-core-foundation"] }
objc2-web-kit = "0.3.2"
regex = "1.13.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0.154"
toml_edit = "0.25.19"
