[package]
name = "deepmem-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "libc", "NSApplication", "NSResponder", "NSEvent", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSObject", "NSRunLoop", "NSString"] }
regex = "1.13.1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "1.2.1"
